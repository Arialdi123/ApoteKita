name: apotek_kita
description: "Aplikasi mobile ApoteKita untuk memudahkan pengguna mencari informasi obat, melakukan pemesanan, dan mengelola pembelian obat."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  flutter_native_splash: ^2.4.1
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# ─── Flutter Launcher Icons ─────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_icon.png"
  min_sdk_android: 21

# ─── Flutter Native Splash ──────────────────────────────────────────────────
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo/splash_logo.png
  android: true
  ios: true
  fullscreen: false
  android_12:
    color: "#FFFFFF"
    image: assets/logo/splash_logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/logo/K.svg
    - assets/logo/Plus.svg
    - assets/logo/app_icon.png
    - assets/logo/splash_logo.png
    - assets/logo/google_logo.svg
